version: 2

models:
  - name: stg_weather_observations
    description: "Staging model for weather observations from Open-Meteo"
    columns:
      - name: observed_at
        description: "Timestamp when the weather observation was recorded"
        data_tests:
          - not_null

      - name: latitude
        data_tests:
          - not_null

      - name: longitude
        data_tests:
          - not_null

      - name: ingested_at
        description: "Timestamp when the record was ingested into the pipeline"
        data_tests:
          - not_null
